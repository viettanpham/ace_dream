<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050B14" />
      <stop offset="50%" stop-color="#0B1526" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="180" height="180" rx="36" fill="url(#bgGrad)" />
  <rect width="176" height="176" x="2" y="2" rx="34" stroke="#0284C7" stroke-opacity="0.35" stroke-width="2" />

  <!-- Radar / Crosshair Grid lines -->
  <circle cx="90" cy="90" r="58" stroke="#38BDF8" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 4" />
  <circle cx="90" cy="90" r="32" stroke="#38BDF8" stroke-opacity="0.12" stroke-width="1" />
  <line x1="90" y1="20" x2="90" y2="40" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" />
  <line x1="90" y1="140" x2="90" y2="160" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" />
  <line x1="20" y1="90" x2="40" y2="90" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" />
  <line x1="140" y1="90" x2="160" y2="90" stroke="#38BDF8" stroke-opacity="0.4" stroke-width="2" />

  <!-- STARFRONT Fighter Chevron / Emblem -->
  <g filter="url(#glow)">
    <!-- Wings Outer -->
    <path d="M90 32 L138 126 L118 126 L90 82 L62 126 L42 126 Z" fill="url(#cyanGrad)" />
    <!-- Center Interceptor Cockpit / Core -->
    <path d="M90 46 L108 116 L90 102 L72 116 Z" fill="#F8FAFC" />
    <!-- Accent Core Star / Thruster -->
    <polygon points="90,70 94,84 108,84 96,92 100,104 90,96 80,104 84,92 72,84 86,84" fill="url(#goldGrad)" />
  </g>
</svg>