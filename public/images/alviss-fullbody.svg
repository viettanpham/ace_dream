<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" width="900" height="1600">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg_alviss" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#3b0764" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>

    <!-- Suit Gradient -->
    <linearGradient id="suit_alviss" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow_alviss" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Soft Drop Shadow -->
    <filter id="shadow_alviss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- 1. Background: Atmospheric Sci-Fi Aerospace Hangar -->
  <rect width="900" height="1600" fill="url(#bg_alviss)" />

  <!-- Subtle Perspective Floor Grid -->
  <g opacity="0.18" stroke="#a855f7" stroke-width="1.5">
    <line x1="150" y1="1600" x2="380" y2="1150" />
    <line x1="300" y1="1600" x2="420" y2="1150" />
    <line x1="600" y1="1600" x2="480" y2="1150" />
    <line x1="750" y1="1600" x2="520" y2="1150" />
    <line x1="50" y1="1150" x2="850" y2="1150" stroke-dasharray="12 12" />
    <line x1="30" y1="1300" x2="870" y2="1300" stroke-dasharray="16 12" />
    <line x1="0" y1="1480" x2="900" y2="1480" stroke-dasharray="24 16" />
  </g>

  <!-- Volumetric Nebula Starfield & Energy Dust -->
  <g opacity="0.4">
    <circle cx="200" cy="300" r="3" fill="#ffffff" />
    <circle cx="720" cy="240" r="2.5" fill="#ffffff" />
    <circle cx="340" cy="180" r="2" fill="#a855f7" />
    <circle cx="600" cy="360" r="3" fill="#c084fc" />
    <circle cx="150" cy="550" r="2" fill="#ffffff" />
    <circle cx="780" cy="620" r="2.5" fill="#a855f7" />
    <circle cx="280" cy="750" r="1.5" fill="#ffffff" />
    <circle cx="680" cy="880" r="2" fill="#c084fc" />
  </g>

  <!-- Silhouette Aura Behind Pilot -->
  <ellipse cx="450" cy="800" rx="260" ry="580" fill="#a855f7" opacity="0.14" filter="url(#glow_alviss)" />

  <!-- ==================================================================== -->
  <!-- 2. CHARACTER MODEL: COMPLETE HEAD-TO-TOE ARTWORK                     -->
  <!-- ==================================================================== -->
  <g filter="url(#shadow_alviss)">
    <!-- MALE PILOT: MUSCULAR & TACTICAL SILHOUETTE (HEAD TO TOE) -->
    <!-- A. BOOTS & MAGNETIC TACTICAL SOLES (Y: 1250 to 1480) -->
    <g id="boots_male">
      <!-- Left Boot -->
      <path d="M 310 1240 L 290 1420 Q 285 1455 335 1460 L 415 1460 Q 425 1435 415 1240 Z" fill="#09090b" stroke="#a855f7" stroke-width="3" />
      <!-- Left Reinforced Steel Sole -->
      <path d="M 275 1445 L 425 1445 L 430 1470 L 270 1470 Z" fill="#18181b" stroke="#a855f7" stroke-width="2" />
      <rect x="300" y="1330" width="105" height="12" rx="3" fill="#a855f7" opacity="0.8" filter="url(#glow_alviss)" />

      <!-- Right Boot -->
      <path d="M 485 1240 L 475 1435 Q 475 1460 555 1460 L 610 1445 Q 615 1410 590 1240 Z" fill="#09090b" stroke="#a855f7" stroke-width="3" />
      <!-- Right Reinforced Steel Sole -->
      <path d="M 470 1445 L 625 1445 L 625 1470 L 470 1470 Z" fill="#18181b" stroke="#a855f7" stroke-width="2" />
      <rect x="495" y="1330" width="105" height="12" rx="3" fill="#a855f7" opacity="0.8" filter="url(#glow_alviss)" />
    </g>

    <!-- B. LEGS & TACTICAL CARGO EXOSUIT (Y: 820 to 1250) -->
    <g id="legs_male">
      <!-- Left Leg -->
      <path d="M 350 820 L 320 1050 L 330 1250 L 415 1250 L 435 1050 L 440 820 Z" fill="url(#suit_alviss)" stroke="#a855f7" stroke-width="2.5" />
      <!-- Right Leg -->
      <path d="M 460 820 L 465 1050 L 485 1250 L 575 1250 L 585 1050 L 550 820 Z" fill="url(#suit_alviss)" stroke="#a855f7" stroke-width="2.5" />

      <!-- Heavy Angular Kneepads -->
      <polygon points="310,1050 425,1050 415,1120 320,1120" fill="#27272a" stroke="#a855f7" stroke-width="2.5" />
      <rect x="345" y="1075" width="45" height="15" rx="3" fill="#c084fc" filter="url(#glow_alviss)" />

      <polygon points="475,1050 590,1050 580,1120 485,1120" fill="#27272a" stroke="#a855f7" stroke-width="2.5" />
      <rect x="510" y="1075" width="45" height="15" rx="3" fill="#c084fc" filter="url(#glow_alviss)" />

      <!-- Side Holster & Demolition Ammo Pouches -->
      <rect x="295" y="900" width="40" height="70" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="2" />
      <rect x="565" y="900" width="40" height="70" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="2" />
    </g>

    <!-- C. WAIST, COMBAT HARNESS & MODULAR BELT (Y: 740 to 830) -->
    <g id="waist_male">
      <rect x="330" y="750" width="240" height="40" rx="6" fill="#18181b" stroke="#a855f7" stroke-width="3" />
      <!-- Heavy Duty Buckle -->
      <rect x="420" y="745" width="60" height="50" rx="6" fill="#27272a" stroke="#c084fc" stroke-width="2.5" />
      <circle cx="450" cy="770" r="10" fill="#c084fc" filter="url(#glow_alviss)" />
      <circle cx="450" cy="770" r="4" fill="#ffffff" />
    </g>

    <!-- D. BROAD TORSO & MECHANICAL CUIRASS (Y: 460 to 760) -->
    <g id="torso_male">
      <!-- V-Taper Muscular Torso -->
      <path d="M 300 480 L 340 760 L 560 760 L 600 480 Z" fill="url(#suit_alviss)" stroke="#a855f7" stroke-width="3" />

      <!-- Heavy Plated Armor Cuirass -->
      <path d="M 320 480 L 580 480 L 540 660 L 360 660 Z" fill="#1e1b4b" stroke="#a855f7" stroke-width="3" />
      <line x1="450" y1="480" x2="450" y2="660" stroke="#a855f7" stroke-width="2" />

      <!-- Reactor Arc Core / Telemetry Beacon -->
      <polygon points="450,530 480,570 450,610 420,570" fill="#09090b" stroke="#c084fc" stroke-width="3" />
      <circle cx="450" cy="570" r="14" fill="#c084fc" filter="url(#glow_alviss)" />
      <circle cx="450" cy="570" r="6" fill="#ffffff" />

      <!-- Neck & Collar -->
      <path d="M 405 420 L 495 420 L 515 480 L 385 480 Z" fill="#fed7aa" stroke="#fdba74" stroke-width="2" />
      <path d="M 385 460 L 515 460 L 505 490 L 395 490 Z" fill="#18181b" stroke="#a855f7" stroke-width="2.5" />
    </g>

    <!-- E. BROAD SHOULDERS, ARMS & ARMORED GAUNTLETS (Y: 460 to 860) -->
    <g id="arms_male">
      <!-- Left Arm -->
      <path d="M 300 480 Q 230 620 250 780 L 295 780 Q 295 640 350 490 Z" fill="url(#suit_alviss)" stroke="#a855f7" stroke-width="2.5" />
      <!-- Left Pauldron (Heavy Angular Shoulder Guard) -->
      <polygon points="270,460 350,460 340,540 260,530" fill="#27272a" stroke="#a855f7" stroke-width="3" />
      <!-- Left Gauntlet -->
      <rect x="235" y="680" width="55" height="90" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="2.5" />
      <!-- Left Hand / Holding Flight Helmet or Clenched -->
      <ellipse cx="270" cy="815" rx="35" ry="32" fill="#27272a" stroke="#c084fc" stroke-width="2.5" />
      <rect x="250" y="800" width="40" height="15" rx="4" fill="#a855f7" opacity="0.9" filter="url(#glow_alviss)" />

      <!-- Right Arm -->
      <path d="M 600 480 Q 670 620 650 780 L 605 780 Q 605 640 550 490 Z" fill="url(#suit_alviss)" stroke="#a855f7" stroke-width="2.5" />
      <!-- Right Pauldron -->
      <polygon points="630,460 550,460 560,540 640,530" fill="#27272a" stroke="#a855f7" stroke-width="3" />
      <!-- Right Gauntlet -->
      <rect x="610" y="680" width="55" height="90" rx="8" fill="#18181b" stroke="#a855f7" stroke-width="2.5" />
      <!-- Right Arm Clenched Fist -->
      <path d="M 620 780 L 655 780 L 650 835 L 615 830 Z" fill="#27272a" stroke="#a855f7" stroke-width="2" />
    </g>

    <!-- F. HEAD, FACE & DETERMINED EXPRESSION (Y: 220 to 440) -->
    <g id="head_male">
      <!-- Strong Jaw & Head Contour -->
      <path d="M 380 290 Q 370 380 450 435 Q 530 380 520 290 Z" fill="#ffedd5" stroke="#fed7aa" stroke-width="2" />

      <!-- Sharp Eyes -->
      <!-- Left Eye -->
      <path d="M 395 340 L 435 340 L 430 355 L 400 355 Z" fill="#ffffff" stroke="#18181b" stroke-width="2" />
      <circle cx="415" cy="347" r="7" fill="#f59e0b" />
      <circle cx="417" cy="345" r="2.5" fill="#ffffff" />
      <line x1="390" y1="332" x2="438" y2="335" stroke="#18181b" stroke-width="3" />

      <!-- Right Eye -->
      <path d="M 465 340 L 505 340 L 500 355 L 470 355 Z" fill="#ffffff" stroke="#18181b" stroke-width="2" />
      <circle cx="485" cy="347" r="7" fill="#f59e0b" />
      <circle cx="487" cy="345" r="2.5" fill="#ffffff" />
      <line x1="462" y1="335" x2="510" y2="332" stroke="#18181b" stroke-width="3" />

      <!-- Battle Scar / Facial Character -->
      <line x1="495" y1="320" x2="510" y2="345" stroke="#dc2626" stroke-width="2" opacity="0.75" />

      <!-- Strong Nose & Firm Mouth -->
      <path d="M 450 350 L 445 375 L 455 377" stroke="#ea580c" stroke-width="2" fill="none" />
      <line x1="430" y1="400" x2="470" y2="400" stroke="#78350f" stroke-width="2.5" />

      <!-- Hair (Short Textured Military Hair) -->
      <path d="M 360 290 Q 450 200 540 290 L 530 250 Q 450 180 370 250 Z" fill="#18181b" stroke="#a855f7" stroke-width="1.5" />
      <!-- Communication Earpiece / Headset -->
      <rect x="360" y="325" width="14" height="28" rx="4" fill="#18181b" stroke="#c084fc" stroke-width="2" />
      <circle cx="367" cy="339" r="4" fill="#c084fc" filter="url(#glow_alviss)" />
    </g>
  </g>
</svg>