<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="100%" height="100%">
  <defs>
    <linearGradient id="eric-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0808"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#180404"/>
    </linearGradient>
    <radialGradient id="eric-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#991b1b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="eric-suit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="eric-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="eric-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <filter id="eric-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="800" fill="url(#eric-bg-grad)"/>
  <circle cx="270" cy="280" r="240" fill="url(#eric-glow)"/>

  <!-- Tactical Target Grids -->
  <g stroke="#ef4444" stroke-width="1" opacity="0.18">
    <line x1="40" y1="0" x2="40" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="150" x2="540" y2="150"/>
    <line x1="0" y1="480" x2="540" y2="480"/>
    <circle cx="270" cy="270" r="160" fill="none" stroke-dasharray="8 6"/>
    <line x1="270" y1="90" x2="270" y2="450" stroke-dasharray="4 4"/>
  </g>

  <!-- Legs & Armored Boots -->
  <path d="M 210,430 L 200,570 L 242,570 L 254,430 Z" fill="url(#eric-suit)"/>
  <path d="M 195,565 L 185,740 L 248,740 L 244,565 Z" fill="#171717"/>
  <line x1="216" y1="565" x2="216" y2="720" stroke="#ef4444" stroke-width="2.5" filter="url(#eric-neon-glow)"/>

  <path d="M 286,430 L 298,570 L 340,570 L 330,430 Z" fill="url(#eric-suit)"/>
  <path d="M 296,565 L 292,740 L 355,740 L 345,565 Z" fill="#171717"/>
  <line x1="324" y1="565" x2="324" y2="720" stroke="#ef4444" stroke-width="2.5" filter="url(#eric-neon-glow)"/>

  <!-- Streamlined Flight Suit & Armor Plating -->
  <path d="M 210,240 L 200,435 L 340,435 L 330,240 Z" fill="url(#eric-suit)"/>
  <!-- Crimson Racing & Armor Trim -->
  <path d="M 225,245 L 245,430" stroke="#ef4444" stroke-width="3" filter="url(#eric-neon-glow)"/>
  <path d="M 315,245 L 295,430" stroke="#ef4444" stroke-width="3" filter="url(#eric-neon-glow)"/>
  <!-- Chest Armor Vents -->
  <polygon points="250,260 290,260 280,310 260,310" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>

  <!-- Utility Belt -->
  <rect x="200" y="420" width="140" height="18" rx="2" fill="#0a0a0a" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="255" y="416" width="30" height="26" rx="4" fill="#dc2626"/>

  <!-- Left Arm (Armored Cannon / Targeter Gauntlet) -->
  <path d="M 200,240 L 165,360 L 195,365 L 225,255 Z" fill="url(#eric-suit)"/>
  <rect x="155" y="355" width="45" height="50" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>

  <!-- Right Arm (Tactical Controller) -->
  <path d="M 330,240 L 365,360 L 335,365 L 315,255 Z" fill="url(#eric-suit)"/>
  <rect x="335" y="355" width="45" height="50" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>

  <!-- Neck & Sharp Jaw -->
  <rect x="252" y="195" width="36" height="28" fill="url(#eric-skin)"/>
  <!-- Head & Sharp Face -->
  <path d="M 235,135 Q 235,210 270,210 Q 305,210 305,135 Q 305,110 270,110 Q 235,110 235,135 Z" fill="url(#eric-skin)"/>

  <!-- Intense Steel Blue Eyes -->
  <ellipse cx="254" cy="155" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="254" cy="155" r="4" fill="#dc2626"/>
  <circle cx="253" cy="154" r="1.5" fill="#ffffff"/>
  <path d="M 245,148 L 263,150" stroke="#0a0a0a" stroke-width="2.5"/>

  <ellipse cx="286" cy="155" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="286" cy="155" r="4" fill="#dc2626"/>
  <circle cx="285" cy="154" r="1.5" fill="#ffffff"/>
  <path d="M 277,150 L 295,148" stroke="#0a0a0a" stroke-width="2.5"/>

  <!-- Sharp Nose & Firm Mouth -->
  <path d="M 270,165 L 268,172 L 273,172" stroke="#991b1b" stroke-width="1.8" fill="none"/>
  <path d="M 262,185 L 278,185" stroke="#450a0a" stroke-width="2.5"/>

  <!-- Hair (Jet black, styled sharp anime haircut) -->
  <path d="M 230,135 Q 225,90 270,85 Q 315,90 310,135 Q 300,110 285,115 Q 270,105 255,115 Q 240,110 230,135 Z" fill="#09090b"/>
  <!-- Cybernetic Comms Headset -->
  <rect x="228" y="145" width="8" height="20" rx="2" fill="#ef4444" filter="url(#eric-neon-glow)"/>
  <path d="M 232,160 Q 242,185 258,185" stroke="#ef4444" stroke-width="1.5" fill="none"/>

  <!-- Character Banner: ERIC // AIR-COMBAT SPECIALIST -->
  <g transform="translate(40, 720)">
    <rect width="460" height="52" rx="4" fill="#450a0a" opacity="0.9" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="24" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">CALLSIGN: BUNKER BREAKER // PILOT NO. 04</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" letter-spacing="1">ERIC BRANDT <tspan fill="#f87171" font-size="12" font-weight="bold">· NAM (28T)</tspan></text>
    <rect x="360" y="12" width="85" height="28" rx="3" fill="#991b1b" stroke="#fca5a5" stroke-width="1"/>
    <text x="402" y="30" fill="#fee2e2" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">STRIKE FIT</text>
  </g>
</svg>
