<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="eric-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#450a0a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#18181b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="eric-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="eric-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="e-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="320" rx="16" fill="url(#eric-bg)"/>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <!-- Heavy Siege Shoulders -->
  <path d="M60,265 L105,205 L160,225 L215,205 L260,265 L275,320 L45,320 Z" fill="#27272a" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M80,245 L120,210 L145,235 L95,280 Z" fill="url(#eric-armor)" opacity="0.85"/>
  <path d="M240,245 L200,210 L175,235 L225,280 Z" fill="url(#eric-armor)" opacity="0.85"/>
  <!-- Neck Collar -->
  <path d="M120,195 L160,220 L200,195 L190,170 L130,170 Z" fill="#450a0a" stroke="#f87171" stroke-width="2"/>
  <!-- Heavy Bunker Helmet -->
  <path d="M105,130 Q105,65 160,65 Q215,65 215,130 Q215,185 160,195 Q105,185 105,130 Z" fill="#18181b" stroke="#dc2626" stroke-width="3"/>
  <!-- Visor: Heavy Slit Visor -->
  <rect x="120" y="125" width="80" height="22" rx="4" fill="url(#eric-visor)" filter="url(#e-glow)"/>
  <line x1="125" y1="136" x2="195" y2="136" stroke="#fef2f2" stroke-width="2" opacity="0.9"/>
  <!-- Armored Crest -->
  <rect x="154" y="55" width="12" height="25" rx="3" fill="#ef4444"/>
  <!-- Tactical HUD Marks -->
  <text x="25" y="40" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold" opacity="0.8">PILOT: ERIC // B-CLASS</text>
  <text x="25" y="55" fill="#fca5a5" font-family="monospace" font-size="8" opacity="0.6">SPEC: AIRCRAFT SPECIALIST</text>
  <path d="M260,35 L285,35 L285,60" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.6"/>
  <path d="M35,275 L35,295 L55,295" fill="none" stroke="#f87171" stroke-width="1.5" opacity="0.6"/>
</svg>
