<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="p_bg_eric" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#450a0a" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#020204" />
    </radialGradient>

    <filter id="p_glow_eric" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#p_bg_eric)" />

  <!-- Bokeh Particles -->
  <g opacity="0.3">
    <circle cx="200" cy="200" r="4" fill="#ffffff" />
    <circle cx="850" cy="300" r="5" fill="#f97316" />
    <circle cx="300" cy="750" r="3" fill="#ef4444" />
    <circle cx="750" cy="800" r="4" fill="#ffffff" />
  </g>

  <!-- Character Aura -->
  <ellipse cx="512" cy="540" rx="320" ry="360" fill="#ef4444" opacity="0.2" filter="url(#p_glow_eric)" />

  <!-- Character Bust Portrait -->
  <g transform="translate(62, -20) scale(1.0)">
    <!-- Male Bust -->
        <!-- Broad Shoulders & Heavy Cuirass -->
        <path d="M 170 780 Q 450 710 730 780 L 800 1050 L 100 1050 Z" fill="#292524" stroke="#ef4444" stroke-width="4" />
        <path d="M 280 770 L 620 770 L 570 1050 L 330 1050 Z" fill="#18181b" stroke="#ef4444" stroke-width="3" />
        <circle cx="450" cy="880" r="24" fill="#f97316" filter="url(#p_glow_eric)" />
        <circle cx="450" cy="880" r="10" fill="#ffffff" />

        <!-- Neck -->
        <path d="M 370 580 L 530 580 L 550 770 L 350 770 Z" fill="#fed7aa" stroke="#fdba74" stroke-width="2.5" />
        <path d="M 350 720 L 550 720 L 535 770 L 365 770 Z" fill="#18181b" stroke="#ef4444" stroke-width="3" />

        <!-- Jaw & Face -->
        <path d="M 340 390 Q 320 540 450 640 Q 580 540 560 390 Z" fill="#ffedd5" stroke="#fed7aa" stroke-width="2.5" />

        <!-- Left Eye -->
        <path d="M 370 480 L 425 480 L 420 500 L 375 500 Z" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />
        <circle cx="400" cy="490" r="10" fill="#57534e" />
        <circle cx="403" cy="487" r="3.5" fill="#ffffff" />
        <line x1="360" y1="468" x2="430" y2="472" stroke="#18181b" stroke-width="4" />

        <!-- Right Eye -->
        <path d="M 475 480 L 530 480 L 525 500 L 480 500 Z" fill="#ffffff" stroke="#18181b" stroke-width="2.5" />
        <circle cx="500" cy="490" r="10" fill="#57534e" />
        <circle cx="503" cy="487" r="3.5" fill="#ffffff" />
        <line x1="470" y1="472" x2="540" y2="468" stroke="#18181b" stroke-width="4" />

        <!-- Scar -->
        <line x1="515" y1="450" x2="535" y2="490" stroke="#dc2626" stroke-width="3" opacity="0.8" />

        <!-- Nose & Mouth -->
        <path d="M 450 495 L 442 535 L 458 538" stroke="#ea580c" stroke-width="3" fill="none" />
        <line x1="420" y1="575" x2="480" y2="575" stroke="#78350f" stroke-width="3.5" />

        <!-- Short Textured Military Hair -->
        <path d="M 310 390 Q 450 250 590 390 L 570 330 Q 450 230 330 330 Z" fill="#1c1917" stroke="#ef4444" stroke-width="2" />
        <!-- Headset -->
        <rect x="310" y="450" width="18" height="42" rx="6" fill="#18181b" stroke="#f97316" stroke-width="2.5" />
        <circle cx="319" cy="471" r="5" fill="#f97316" filter="url(#p_glow_eric)" />
  </g>
</svg>