<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="levi-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f1303"/>
      <stop offset="50%" stop-color="#2e1a06"/>
      <stop offset="100%" stop-color="#120901"/>
    </linearGradient>
    <radialGradient id="levi-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#78350f" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="levi-hair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95"/>
      <stop offset="40%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f0728"/>
    </linearGradient>
    <linearGradient id="levi-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="50%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="levi-suit-latex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="levi-gold-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </linearGradient>
    <linearGradient id="levi-boot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="60%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="levi-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="540" height="800" fill="url(#levi-bg-grad)"/>
  <circle cx="270" cy="270" r="230" fill="url(#levi-glow)"/>

  <!-- Falcon Flight Deck Velocity Tech Lines -->
  <g stroke="#f59e0b" stroke-width="1" opacity="0.18">
    <line x1="50" y1="0" x2="50" y2="800"/>
    <line x1="490" y1="0" x2="490" y2="800"/>
    <line x1="0" y1="160" x2="540" y2="160"/>
    <line x1="0" y1="470" x2="540" y2="470"/>
    <polygon points="270,70 410,240 370,410 270,460 170,410 130,240" fill="none" stroke-dasharray="10 5"/>
  </g>

  <!-- Holographic Falcon Wings -->
  <g opacity="0.5" filter="url(#levi-neon-glow)">
    <path d="M 270,250 Q 150,180 80,140 Q 140,240 210,280 Z" fill="url(#levi-gold-accent)" opacity="0.4"/>
    <path d="M 270,250 Q 390,180 460,140 Q 400,240 330,280 Z" fill="url(#levi-gold-accent)" opacity="0.4"/>
    <circle cx="270" cy="250" r="140" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="8 6"/>
  </g>

  <!-- High Ponytail Hair Flowing Left & Back (Sleek dynamic anime ponytail) -->
  <path d="M 260,110 Q 230,40 180,60 Q 130,90 100,180 Q 80,260 120,330 Q 135,270 140,200 Q 160,130 240,110 Z" fill="url(#levi-hair)"/>
  <path d="M 120,180 Q 90,260 95,350 Q 115,280 135,220 Z" fill="#6d28d9" opacity="0.6"/>
  <!-- Glowing Orange Hairband Clip -->
  <rect x="235" y="90" width="16" height="20" rx="3" fill="#f59e0b" filter="url(#levi-neon-glow)"/>

  <!-- Legs & Sexy Tight High-Tech Thigh-High Flight Boots -->
  <!-- Thigh Skin (Right & Left) -->
  <path d="M 215,440 L 210,530 L 246,530 L 254,440 Z" fill="url(#levi-skin)"/>
  <path d="M 286,440 L 294,530 L 330,530 L 325,440 Z" fill="url(#levi-skin)"/>

  <!-- Thigh Holster & High-Speed Interface Garter -->
  <path d="M 211,475 L 248,475" stroke="#f59e0b" stroke-width="3" filter="url(#levi-neon-glow)"/>
  <rect x="220" y="470" width="16" height="22" rx="3" fill="#18181b" stroke="#f59e0b" stroke-width="1"/>
  <path d="M 292,475 L 329,475" stroke="#f59e0b" stroke-width="3" filter="url(#levi-neon-glow)"/>

  <!-- Seductive Thigh-High Aerodynamic Boots (Tight fit, amber speed vents) -->
  <!-- Left Boot -->
  <path d="M 206,520 Q 200,620 205,720 L 246,720 Q 248,620 248,520 Z" fill="url(#levi-boot)"/>
  <path d="M 196,715 L 202,745 L 252,745 L 248,715 Z" fill="#09090b"/>
  <!-- Gold Accent Lines on Left Boot -->
  <path d="M 207,525 L 247,525" stroke="#fbbf24" stroke-width="3" filter="url(#levi-neon-glow)"/>
  <path d="M 226,535 L 226,690" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="216,610 236,600 236,620" fill="#fbbf24"/>

  <!-- Right Boot -->
  <path d="M 292,520 Q 292,620 295,720 L 336,720 Q 340,620 334,520 Z" fill="url(#levi-boot)"/>
  <path d="M 290,715 L 288,745 L 340,745 L 344,715 Z" fill="#09090b"/>
  <!-- Gold Accent Lines on Right Boot -->
  <path d="M 293,525 L 333,525" stroke="#fbbf24" stroke-width="3" filter="url(#levi-neon-glow)"/>
  <path d="M 314,535 L 314,690" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="304,610 324,600 324,620" fill="#fbbf24"/>

  <!-- Tight Form-Fitting Pilot Bodysuit / Tight Skirt (Váy bó sát quyến rũ) -->
  <path d="M 215,360 L 325,360 Q 345,410 335,450 L 205,450 Q 195,410 215,360 Z" fill="url(#levi-suit-latex)"/>
  <!-- Bodysuit Sheen & Gold Seams -->
  <path d="M 228,360 Q 220,410 215,450" stroke="#fbbf24" stroke-width="2" filter="url(#levi-neon-glow)"/>
  <path d="M 312,360 Q 320,410 325,450" stroke="#fbbf24" stroke-width="2" filter="url(#levi-neon-glow)"/>
  <path d="M 205,448 L 335,448" stroke="#f59e0b" stroke-width="3"/>

