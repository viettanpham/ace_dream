  <!-- Left Eye -->
  <ellipse cx="254" cy="158" rx="9" ry="6" fill="#ffffff"/>
  <ellipse cx="254" cy="158" rx="6" ry="6" fill="#d97706"/>
  <ellipse cx="254" cy="158" rx="3.5" ry="3.5" fill="#451a03"/>
  <circle cx="252" cy="156" r="2" fill="#ffffff"/>
  <path d="M 244,152 Q 255,145 266,151" stroke="#09090b" stroke-width="2.5" fill="none"/>
  <path d="M 266,151 L 271,147" stroke="#09090b" stroke-width="2.2"/> <!-- Sexy winged eyeliner -->

