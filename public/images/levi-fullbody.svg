  <path d="M 215,230 L 175,320 L 195,335 L 228,250 Z" fill="url(#levi-suit-latex)"/>
  <path d="M 175,320 L 195,370 L 215,365 L 195,335 Z" fill="#27272a"/>
  <!-- Left Hand resting on hip -->
  <path d="M 210,360 L 220,380 L 205,385 Z" fill="url(#levi-skin)"/>

  <!-- Right Arm (Forearm raised, holographic tactical controller) -->
  <path d="M 325,230 L 365,310 L 345,325 L 315,250 Z" fill="url(#levi-suit-latex)"/>
  <!-- Gauntlet Interface -->
