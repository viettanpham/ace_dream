  <ellipse cx="286" cy="158" rx="6" ry="6" fill="#d97706"/>
  <ellipse cx="286" cy="158" rx="3.5" ry="3.5" fill="#451a03"/>
  <circle cx="284" cy="156" r="2" fill="#ffffff"/>
  <path d="M 276,152 Q 287,145 298,151" stroke="#09090b" stroke-width="2.5" fill="none"/>
  <path d="M 298,151 L 303,147" stroke="#09090b" stroke-width="2.2"/>

