  <path d="M 225,260 L 245,330 L 235,350" stroke="#fbbf24" stroke-width="2.5" fill="none" filter="url(#levi-neon-glow)"/>
  <path d="M 315,260 L 295,330 L 305,350" stroke="#fbbf24" stroke-width="2.5" fill="none" filter="url(#levi-neon-glow)"/>

