  <circle cx="286" cy="158" r="14" fill="#f59e0b" opacity="0.25" stroke="#fbbf24" stroke-width="1.5" filter="url(#levi-neon-glow)"/>
  <line x1="272" y1="158" x2="300" y2="158" stroke="#fbbf24" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Nose & Seductive Smirk Lips -->
  <path d="M 269,168 L 271,171" stroke="#fb7185" stroke-width="1.5"/>
  <path d="M 262,184 Q 272,192 278,183" stroke="#e11d48" stroke-width="2.5" fill="none"/>
  <circle cx="272" cy="186" r="1.5" fill="#ffffff"/>

  <!-- Hair Bangs (Violet-indigo side-swept bangs) -->
  <path d="M 235,135 Q 230,80 270,80 Q 310,80 305,135 Q 300,165 290,175 Q 280,140 270,145 Q 255,175 245,140 Z" fill="url(#levi-hair)"/>
  <path d="M 245,100 Q 270,90 295,100" stroke="#a78bfa" stroke-width="2" opacity="0.5" fill="none"/>

  <!-- Character Banner: LEVI // FALCON INTERCEPTOR -->
  <g transform="translate(40, 720)">
    <rect width="460" height="52" rx="4" fill="#261405" opacity="0.9" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="24" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">CALLSIGN: SHADOW FALCON // PILOT NO. 03</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" letter-spacing="1">LEVI REED <tspan fill="#fcd34d" font-size="12" font-weight="bold">· NỮ (24T)</tspan></text>
    <rect x="360" y="12" width="85" height="28" rx="3" fill="#78350f" stroke="#fbbf24" stroke-width="1"/>
    <text x="402" y="30" fill="#fef3c7" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">FALCON FIT</text>
  </g>
</svg>
