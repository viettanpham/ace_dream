<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="100%" height="100%">
  <defs>
    <linearGradient id="marcus-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f2d"/>
      <stop offset="50%" stop-color="#082f49"/>
      <stop offset="100%" stop-color="#02141e"/>
    </linearGradient>
    <radialGradient id="marcus-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0369a1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="marcus-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="marcus-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#fdba74"/>
    </linearGradient>
    <filter id="marcus-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="540" height="800" fill="url(#marcus-bg-grad)"/>
  <circle cx="270" cy="280" r="240" fill="url(#marcus-glow)"/>

  <!-- Military Holographic Grid -->
  <g stroke="#06b6d4" stroke-width="1" opacity="0.18">
    <line x1="40" y1="0" x2="40" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="140" x2="540" y2="140"/>
    <line x1="0" y1="460" x2="540" y2="460"/>
    <polygon points="270,80 430,220 400,430 270,490 140,430 110,220" fill="none" stroke-dasharray="10 6"/>
  </g>

  <!-- Heavy Combat Armor Legs & Boots -->
  <!-- Left Leg -->
  <path d="M 205,430 L 195,570 L 235,570 L 250,430 Z" fill="url(#marcus-armor)"/>
  <path d="M 190,565 L 180,740 L 245,740 L 240,565 Z" fill="#0f172a"/>
  <rect x="185" y="610" width="50" height="24" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="210" y1="570" x2="210" y2="720" stroke="#06b6d4" stroke-width="2" filter="url(#marcus-neon-glow)"/>

  <!-- Right Leg -->
  <path d="M 290,430 L 305,570 L 345,570 L 335,430 Z" fill="url(#marcus-armor)"/>
  <path d="M 300,565 L 295,740 L 360,740 L 350,565 Z" fill="#0f172a"/>
  <rect x="305" y="610" width="50" height="24" rx="4" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
  <line x1="330" y1="570" x2="330" y2="720" stroke="#06b6d4" stroke-width="2" filter="url(#marcus-neon-glow)"/>

  <!-- Heavy Exo-Suit Torso & Tactical Chestplate -->
  <path d="M 205,240 L 195,435 L 345,435 L 335,240 Z" fill="url(#marcus-armor)"/>
  <!-- Armored Chest Plates -->
  <polygon points="215,250 265,250 265,340 210,330" fill="#334155" stroke="#06b6d4" stroke-width="1.5"/>
  <polygon points="275,250 325,250 330,330 275,340" fill="#334155" stroke="#06b6d4" stroke-width="1.5"/>
  <!-- Glowing Reactor Core on Chest -->
  <circle cx="270" cy="295" r="14" fill="#0891b2" stroke="#22d3ee" stroke-width="2.5" filter="url(#marcus-neon-glow)"/>
  <circle cx="270" cy="295" r="6" fill="#cffafe"/>

  <!-- Tactical Utility Belt & Pouches -->
  <rect x="195" y="420" width="150" height="18" rx="3" fill="#020617" stroke="#06b6d4" stroke-width="1.5"/>
  <rect x="210" y="423" width="22" height="12" rx="2" fill="#475569"/>
  <rect x="308" y="423" width="22" height="12" rx="2" fill="#475569"/>

  <!-- Left Arm (Mechanical Heavy Pauldron) -->
  <circle cx="180" cy="250" r="30" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 165,260 L 145,380 L 180,380 L 195,270 Z" fill="url(#marcus-armor)"/>
  <!-- Combat Gauntlet -->
  <rect x="140" y="370" width="45" height="50" rx="5" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>

  <!-- Right Arm (Grip on side weapon) -->
  <circle cx="360" cy="250" r="30" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
  <path d="M 375,260 L 395,380 L 360,380 L 345,270 Z" fill="url(#marcus-armor)"/>
  <rect x="355" y="370" width="45" height="50" rx="5" fill="#0f172a" stroke="#06b6d4" stroke-width="2"/>

  <!-- Neck & Sturdy Jaw -->
  <rect x="250" y="195" width="40" height="30" fill="url(#marcus-skin)"/>
  <!-- Face & Head -->
  <path d="M 235,135 Q 235,210 270,210 Q 305,210 305,135 Q 305,110 270,110 Q 235,110 235,135 Z" fill="url(#marcus-skin)"/>
  <!-- Masculine Stubble on jaw -->
  <path d="M 245,185 Q 270,205 295,185 L 290,195 Q 270,212 250,195 Z" fill="#78350f" opacity="0.35"/>

  <!-- Eyes (Determined Cyan Gaze) -->
  <ellipse cx="254" cy="155" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="254" cy="155" r="4" fill="#0284c7"/>
  <circle cx="253" cy="154" r="1.5" fill="#ffffff"/>
  <path d="M 245,148 L 263,150" stroke="#1e293b" stroke-width="2.5"/>

  <ellipse cx="286" cy="155" rx="7" ry="5" fill="#ffffff"/>
  <circle cx="286" cy="155" r="4" fill="#0284c7"/>
  <circle cx="285" cy="154" r="1.5" fill="#ffffff"/>
  <path d="M 277,150 L 295,148" stroke="#1e293b" stroke-width="2.5"/>

  <!-- Confident Grin & Nose -->
  <path d="M 270,165 L 268,172 L 273,172" stroke="#b45309" stroke-width="1.8" fill="none"/>
  <path d="M 260,184 L 280,184" stroke="#78350f" stroke-width="2.5"/>

  <!-- Hair (Short styled masculine brown hair with undercut) -->
  <path d="M 230,135 Q 225,95 270,90 Q 315,95 310,135 Q 300,115 285,120 Q 270,110 255,120 Q 240,115 230,135 Z" fill="#451a03"/>

  <!-- Character Banner: MARCUS // VANGUARD SPECIALIST -->
  <g transform="translate(40, 720)">
    <rect width="460" height="52" rx="4" fill="#082f49" opacity="0.9" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="20" y="24" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">CALLSIGN: WAR DOG // PILOT NO. 01</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" letter-spacing="1">MARCUS THORNE <tspan fill="#7dd3fc" font-size="12" font-weight="bold">· NAM (30T)</tspan></text>
    <rect x="360" y="12" width="85" height="28" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="1"/>
    <text x="402" y="30" fill="#e0f2fe" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">VANGUARD FIT</text>
  </g>
</svg>
