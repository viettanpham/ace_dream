<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="marcus-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#083344" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="marcus-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="marcus-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="m-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="320" rx="16" fill="url(#marcus-bg)"/>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <!-- Shoulder Plates -->
  <path d="M70,270 L110,210 L160,230 L210,210 L250,270 L260,320 L60,320 Z" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  <path d="M85,250 L120,215 L140,240 L100,280 Z" fill="url(#marcus-armor)" opacity="0.8"/>
  <path d="M235,250 L200,215 L180,240 L220,280 Z" fill="url(#marcus-armor)" opacity="0.8"/>
  <!-- Neck Collar -->
  <path d="M125,200 L160,225 L195,200 L185,175 L135,175 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Helmet Base -->
  <path d="M110,130 Q110,65 160,65 Q210,65 210,130 Q210,185 160,195 Q110,185 110,130 Z" fill="#0f172a" stroke="#0284c7" stroke-width="2.5"/>
  <!-- Helmet Plates -->
  <path d="M115,115 L160,85 L205,115 L195,145 L160,135 L125,145 Z" fill="#1e293b"/>
  <!-- Visor -->
  <path d="M125,120 Q160,105 195,120 Q200,150 160,155 Q120,150 125,120 Z" fill="url(#marcus-visor)" filter="url(#m-glow)"/>
  <line x1="135" y1="132" x2="185" y2="132" stroke="#e0f2fe" stroke-width="2" opacity="0.8"/>
  <!-- Crest / Antenna -->
  <polygon points="156,50 164,50 162,75 158,75" fill="#38bdf8"/>
  <circle cx="160" cy="50" r="3" fill="#67e8f9" filter="url(#m-glow)"/>
  <!-- Tactical HUD Marks -->
  <text x="25" y="40" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold" opacity="0.7">PILOT: MARCUS // A-CLASS</text>
  <text x="25" y="55" fill="#94a3b8" font-family="monospace" font-size="8" opacity="0.6">SPEC: WEAPONS TACTICIAN</text>
  <path d="M260,35 L285,35 L285,60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <path d="M35,275 L35,295 L55,295" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
</svg>
