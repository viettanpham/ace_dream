<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 800" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="val-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021f18"/>
      <stop offset="50%" stop-color="#042f24"/>
      <stop offset="100%" stop-color="#01140f"/>
    </linearGradient>
    <radialGradient id="val-glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#064e3b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="val-hair" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#d1fae5"/>
      <stop offset="40%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="val-skin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#fecdd3"/>
    </linearGradient>
    <linearGradient id="val-suit-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="val-suit-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="val-skirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#042f2e"/>
      <stop offset="100%" stop-color="#021c1b"/>
    </linearGradient>
    <linearGradient id="val-boot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="val-neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Sci-Fi Tech Frame -->
  <rect width="540" height="800" fill="url(#val-bg-grad)"/>
  <circle cx="270" cy="280" r="240" fill="url(#val-glow)"/>

  <!-- Tech Grid Background lines -->
  <g stroke="#10b981" stroke-width="1" opacity="0.15">
    <line x1="40" y1="0" x2="40" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="0" y1="120" x2="540" y2="120"/>
    <line x1="0" y1="450" x2="540" y2="450"/>
    <line x1="0" y1="680" x2="540" y2="680"/>
    <circle cx="270" cy="260" r="180" fill="none" stroke-dasharray="8 6"/>
    <circle cx="270" cy="260" r="120" fill="none" stroke-dasharray="4 4"/>
  </g>

  <!-- Holographic Shield Halo Behind Head -->
  <g opacity="0.45" filter="url(#val-neon-glow)">
    <polygon points="270,90 390,160 390,320 270,390 150,320 150,160" fill="none" stroke="#34d399" stroke-width="1.5"/>
    <path d="M 270,110 L 370,170 L 370,300 L 270,360 L 170,300 L 170,170 Z" fill="none" stroke="#10b981" stroke-width="1" stroke-dasharray="6 4"/>
  </g>

  <!-- Long Flowing Silver-Emerald Hair (Back Layer) -->
  <path d="M 180,180 Q 140,280 150,420 Q 160,520 200,580 Q 220,530 205,420 Q 195,300 220,200 Z" fill="url(#val-hair)"/>
  <path d="M 360,180 Q 400,280 390,420 Q 380,520 340,580 Q 320,530 335,420 Q 345,300 320,200 Z" fill="url(#val-hair)"/>
  <path d="M 160,250 Q 130,360 145,480 Q 180,450 170,360 Z" fill="#047857" opacity="0.7"/>
  <path d="M 380,250 Q 410,360 395,480 Q 360,450 370,360 Z" fill="#047857" opacity="0.7"/>

  <!-- Body / Thighs & Legs with Sexy Thigh-High Armor Boots -->
  <!-- Left Thigh & Right Thigh (Skin) -->
  <path d="M 220,440 L 210,540 L 245,540 L 255,440 Z" fill="url(#val-skin)"/>
  <path d="M 285,440 L 295,540 L 330,540 L 320,440 Z" fill="url(#val-skin)"/>
  <!-- Subtle thigh garter straps -->
  <path d="M 212,480 L 252,480" stroke="#047857" stroke-width="4"/>
  <path d="M 288,480 L 328,480" stroke="#047857" stroke-width="4"/>
  <circle cx="232" cy="480" r="4" fill="#34d399"/>
  <circle cx="308" cy="480" r="4" fill="#34d399"/>

  <!-- Sexy High-Tech Thigh-High Boots -->
