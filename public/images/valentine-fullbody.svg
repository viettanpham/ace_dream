  <rect x="215" y="370" width="110" height="12" rx="2" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
  <rect x="260" y="367" width="20" height="18" rx="3" fill="#34d399"/>
  <!-- Holster on right hip -->
  <rect x="325" y="375" width="22" height="34" rx="4" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
  <circle cx="336" cy="390" r="4" fill="#6ee7b7"/>

