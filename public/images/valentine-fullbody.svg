  <rect x="155" y="335" width="38" height="42" rx="4" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
  <circle cx="174" cy="355" r="7" fill="#10b981" filter="url(#val-neon-glow)"/>
  <!-- Left Hand (Dainty glove) -->
