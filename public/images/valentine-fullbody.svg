  <path d="M 206,530 Q 200,630 205,720 L 245,720 Q 248,630 248,530 Z" fill="url(#val-boot)"/>
  <path d="M 195,715 L 200,745 L 252,745 L 250,715 Z" fill="#0f172a"/>
  <!-- Boot Neon Armor Trim -->
  <path d="M 207,535 L 247,535" stroke="#10b981" stroke-width="3" filter="url(#val-neon-glow)"/>
  <path d="M 226,545 L 226,690" stroke="#34d399" stroke-width="2"/>
  <rect x="215" y="610" width="22" height="18" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Right Boot -->
  <path d="M 292,530 Q 292,630 295,720 L 335,720 Q 340,630 334,530 Z" fill="url(#val-boot)"/>
  <path d="M 290,715 L 288,745 L 340,745 L 345,715 Z" fill="#0f172a"/>
  <!-- Boot Neon Armor Trim -->
  <path d="M 293,535 L 333,535" stroke="#10b981" stroke-width="3" filter="url(#val-neon-glow)"/>
  <path d="M 314,545 L 314,690" stroke="#34d399" stroke-width="2"/>
  <rect x="303" y="610" width="22" height="18" rx="3" fill="#10b981" opacity="0.8"/>

  <!-- Short Sexy Pilot Uniform Skirt (High-waisted, pleated sci-fi skirt) -->
  <path d="M 215,380 L 325,380 L 350,450 L 190,450 Z" fill="url(#val-skirt)"/>
  <!-- Skirt pleat shadows & neon hem -->
  <path d="M 230,380 L 218,450" stroke="#042f2e" stroke-width="2.5"/>
  <path d="M 255,380 L 250,450" stroke="#042f2e" stroke-width="2.5"/>
  <path d="M 285,380 L 290,450" stroke="#042f2e" stroke-width="2.5"/>
  <path d="M 310,380 L 322,450" stroke="#042f2e" stroke-width="2.5"/>
  <path d="M 188,448 L 352,448" stroke="#10b981" stroke-width="3" filter="url(#val-neon-glow)"/>

