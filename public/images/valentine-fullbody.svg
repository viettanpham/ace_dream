  <path d="M 325,220 L 305,370 L 330,370 L 350,260 Z" fill="url(#val-suit-accent)"/>
  <!-- Jacket Collar -->
  <path d="M 235,210 L 215,250 L 245,260 Z" fill="#047857"/>
  <path d="M 305,210 L 325,250 L 295,260 Z" fill="#047857"/>

