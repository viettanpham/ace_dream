  <path d="M 235,145 Q 235,215 270,215 Q 305,215 305,145 Q 305,115 270,115 Q 235,115 235,145 Z" fill="url(#val-skin)"/>
  <!-- Blush -->
  <ellipse cx="248" cy="175" rx="8" ry="4" fill="#f43f5e" opacity="0.3"/>
  <ellipse cx="292" cy="175" rx="8" ry="4" fill="#f43f5e" opacity="0.3"/>

