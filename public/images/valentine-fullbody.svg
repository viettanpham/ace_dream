  <!-- Left Eye -->
  <ellipse cx="254" cy="160" rx="9" ry="6" fill="#ffffff"/>
  <ellipse cx="255" cy="160" rx="6" ry="6" fill="#059669"/>
  <ellipse cx="255" cy="160" rx="3.5" ry="3.5" fill="#064e3b"/>
  <circle cx="253" cy="158" r="2" fill="#ffffff"/>
  <path d="M 244,154 Q 255,148 265,154" stroke="#0f172a" stroke-width="2.5" fill="none"/>
  <!-- Eyelash flick -->
  <path d="M 265,154 L 269,150" stroke="#0f172a" stroke-width="2"/>

  <!-- Right Eye -->
  <ellipse cx="286" cy="160" rx="9" ry="6" fill="#ffffff"/>
  <ellipse cx="285" cy="160" rx="6" ry="6" fill="#059669"/>
  <ellipse cx="285" cy="160" rx="3.5" ry="3.5" fill="#064e3b"/>
  <circle cx="283" cy="158" r="2" fill="#ffffff"/>
  <path d="M 275,154 Q 285,148 296,154" stroke="#0f172a" stroke-width="2.5" fill="none"/>
  <!-- Eyelash flick -->
  <path d="M 296,154 L 300,150" stroke="#0f172a" stroke-width="2"/>

  <!-- Cute Nose & Alluring Smiling Lips -->
  <path d="M 269,170 L 271,173" stroke="#f43f5e" stroke-width="1.5"/>
  <path d="M 263,186 Q 270,193 277,186" stroke="#e11d48" stroke-width="2.5" fill="none"/>
  <!-- Lip gloss shine -->
  <circle cx="270" cy="188" r="1.5" fill="#ffffff"/>

  <!-- Bangs & Front Hair (Chic layered anime hairstyle) -->
  <path d="M 230,140 Q 225,90 270,90 Q 315,90 310,140 Q 305,175 300,185 Q 295,140 285,145 Q 270,175 260,145 Q 245,185 240,175 Q 235,175 230,140 Z" fill="url(#val-hair)"/>
  <!-- Hair Highlights -->
  <path d="M 245,110 Q 270,100 295,110" stroke="#ffffff" stroke-width="2" opacity="0.6" fill="none"/>

  <!-- High-Tech Pilot Headset / Visor Earclip -->
  <rect x="228" y="145" width="8" height="18" rx="2" fill="#047857" stroke="#34d399" stroke-width="1"/>
  <circle cx="232" cy="154" r="3" fill="#10b981" filter="url(#val-neon-glow)"/>
  <!-- Headset Mic -->
  <path d="M 232,160 Q 240,185 255,185" stroke="#34d399" stroke-width="1.5" fill="none"/>

  <!-- Pilot Floating Holographic Crest: VALENTINE · AEGIS SUPPORT -->
  <g transform="translate(40, 720)">
    <rect width="460" height="52" rx="4" fill="#042f24" opacity="0.85" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="24" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">CALLSIGN: AEGIS ANGEL // PILOT NO. 02</text>
    <text x="20" y="42" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" letter-spacing="1">VALENTINE VANCE <tspan fill="#6ee7b7" font-size="12" font-weight="bold">· NỮ (22T)</tspan></text>
    <rect x="360" y="12" width="85" height="28" rx="3" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="402" y="30" fill="#a7f3d0" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">AEGIS FIT</text>
  </g>
</svg>
