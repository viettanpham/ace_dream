<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="val-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#022c22" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="val-armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="val-visor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="v-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="320" rx="16" fill="url(#val-bg)"/>
  <circle cx="160" cy="160" r="130" fill="none" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <!-- Shoulder Plates -->
  <path d="M75,270 L115,215 L160,230 L205,215 L245,270 L255,320 L65,320 Z" fill="#062e24" stroke="#10b981" stroke-width="2"/>
  <path d="M90,250 L120,220 L140,240 L105,280 Z" fill="url(#val-armor)" opacity="0.8"/>
  <path d="M230,250 L200,220 L180,240 L215,280 Z" fill="url(#val-armor)" opacity="0.8"/>
  <!-- Medic Cross Emblem on Chest -->
  <rect x="156" y="245" width="8" height="22" rx="2" fill="#a7f3d0"/>
  <rect x="149" y="252" width="22" height="8" rx="2" fill="#a7f3d0"/>
  <!-- Neck Collar -->
  <path d="M125,200 L160,225 L195,200 L185,175 L135,175 Z" fill="#064e3b" stroke="#34d399" stroke-width="1.5"/>
  <!-- Helmet Base -->
  <path d="M115,130 Q115,70 160,70 Q205,70 205,130 Q205,185 160,195 Q115,185 115,130 Z" fill="#022c22" stroke="#10b981" stroke-width="2.5"/>
  <!-- Visor -->
  <path d="M125,120 Q160,105 195,120 Q200,150 160,155 Q120,150 125,120 Z" fill="url(#val-visor)" filter="url(#v-glow)"/>
  <line x1="135" y1="130" x2="185" y2="130" stroke="#ecfdf5" stroke-width="2" opacity="0.8"/>
  <!-- Antennae / Comms Unit -->
  <circle cx="108" cy="130" r="5" fill="#34d399"/>
  <circle cx="212" cy="130" r="5" fill="#34d399"/>
  <!-- Tactical HUD Marks -->
  <text x="25" y="40" fill="#34d399" font-family="monospace" font-size="10" font-weight="bold" opacity="0.7">PILOT: VALENTINE // M-CLASS</text>
  <text x="25" y="55" fill="#a7f3d0" font-family="monospace" font-size="8" opacity="0.6">SPEC: RESCUE &amp; SUPPORT</text>
  <path d="M260,35 L285,35 L285,60" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
  <path d="M35,275 L35,295 L55,295" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.6"/>
</svg>
